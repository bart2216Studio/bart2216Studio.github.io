<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>bart2216Studio | Mes Projets</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: #000000; color: #ffffff; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 40px 20px; }
        .projects-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; max-width: 1200px; width: 100%; }
        .project-card { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: inherit; }
        
        /* Conteneur de l'image pour garantir la couleur grise même si l'image charge mal */
        .image-wrapper {
            width: 100%;
            aspect-ratio: 9 / 14;
            background-color: #555555;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 16px;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }
        .project-card:hover .image-wrapper { transform: scale(1.03); background-color: #666666; }
        
        .project-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .project-info { text-align: center; }
        .project-title { font-size: 1.2rem; font-weight: 600; margin-bottom: 6px; }
        .project-desc { font-size: 0.9rem; color: #aaaaaa; line-height: 1.3; }
        @media (max-width: 768px) { .projects-container { grid-template-columns: 1fr; max-width: 320px; } }
    </style>
</head>
<body>
    <main class="projects-container">
        
        <a href="http://bart2216studio.ddnsfree.com/" class="project-card" target="_blank">
            <div class="image-wrapper">
                <img src="%E2%80%8BMy%20goal:%20to%20transform%20level%20design%20into%20an%20intense%20and%20captivating%20psychological%20experience.https://bart2216studio.github.io/pv.png" alt="My Website (Studio)" class="project-image" onerror="this.style.display='none';">
            </div>
            <div class="project-info">
                <h2 class="project-title">My Website (Studio)</h2>
                <p class="project-desc">Horror game developer specializing in immersion and soundscape.</p>
            </div>
        </a>
        <a href="https://github.com/" class="project-card" target="_blank">
            <div class="image-wrapper">
                <img src="https://bart2216studio.github.io/image/pv.png" alt="Test" class="project-image" onerror="this.style.display='none';">
            </div>
            <div class="project-info">
                <h2 class="project-title">Test</h2>
                <p class="project-desc">rdxg</p>
            </div>
        </a>
    </main>
</body>
</html>
