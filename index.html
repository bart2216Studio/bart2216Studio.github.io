<!DOCTYPE html>
<html lang="fr">
<head>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/bart2216Studio/bart2216Studio.github.io/refs/heads/main/Image/Favicons/Logo(2).png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>bart_2216 Studio</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: #312F36; color: #ffffff; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 40px 20px; }
        .projects-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; max-width: 1200px; width: 100%; }
        .project-card { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: inherit; }
        
        /* Conteneur de l'image pour garantir la couleur grise même si l'image charge mal */
        .image-wrapper {
            width: 100%;
            aspect-ratio: 9 / 14;
            background-color: #555555;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 16px;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }
        .project-card:hover .image-wrapper { transform: scale(1.03); background-color: #666666; }
        
        .project-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .project-info { text-align: center; }
        .project-title { font-size: 1.2rem; font-weight: 600; margin-bottom: 6px; }
        .project-desc { font-size: 0.9rem; color: #aaaaaa; line-height: 1.3; }
        @media (max-width: 768px) { .projects-container { grid-template-columns: 1fr; max-width: 320px; } }
    </style>
</head>
<body>
    <main class="projects-container">
        
        <a href="http://bart2216studio.ddnsfree.com/" class="project-card" target="_blank">
            <div class="image-wrapper">
                <img src="https://raw.githubusercontent.com/bart2216Studio/bart2216Studio.github.io/refs/heads/main/Image/pv.png" alt="My WebSite (Studio)" class="project-image" onerror="this.style.display='none';">
            </div>
            <div class="project-info">
                <h2 class="project-title">My WebSite (Studio)</h2>
                <p class="project-desc"></p>
            </div>
        </a>
        <a href="https://github.com/bart2216Studio/Sound-Change" class="project-card" target="_blank">
            <div class="image-wrapper">
                <img src="https://raw.githubusercontent.com/bart2216Studio/bart2216Studio.github.io/refs/heads/main/Image/NA.png" alt="Sound Change" class="project-image" onerror="this.style.display='none';">
            </div>
            <div class="project-info">
                <h2 class="project-title">Sound Change</h2>
                <p class="project-desc"></p>
            </div>
        </a>
        <a href="https://github.com/bart2216Studio/VCompress" class="project-card" target="_blank">
            <div class="image-wrapper">
                <img src="https://raw.githubusercontent.com/bart2216Studio/bart2216Studio.github.io/refs/heads/main/Image/VC.png" alt="VConpress" class="project-image" onerror="this.style.display='none';">
            </div>
            <div class="project-info">
                <h2 class="project-title">VConpress</h2>
                <p class="project-desc"></p>
            </div>
        </a>
    </main>
</body>
</html>
